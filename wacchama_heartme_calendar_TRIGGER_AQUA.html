<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wacchama HEART ME Calendar</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Segoe UI","Yu Gothic",sans-serif}
#s{position:relative;width:100vw;height:100vh;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%}
#c{position:absolute;z-index:3;left:50%;top:50%;width:min(650px,76vw);padding:24px;opacity:0;transform:translate(-50%,-50%) scale(.1);
border:2px solid white;border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(250,245,235,.95));
box-shadow:0 0 28px white,0 0 60px rgba(80,215,245,.75),0 25px 70px #0005;color:#222}
#c.in{animation:cin .8s cubic-bezier(.12,1.35,.3,1) forwards}#c.out{animation:cout .55s ease forwards}
@keyframes cin{60%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes cout{to{opacity:0;transform:translate(-50%,-50%) scale(.75)}}
.logo{text-align:center;font-size:17px;font-weight:900;letter-spacing:5px;color:#27a9c9}.month{text-align:center;font-size:36px;font-weight:1000;margin:2px 0 15px}
.w,.d{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.w div{text-align:center;font-weight:800;opacity:.55}.day{height:58px;display:flex;align-items:center;justify-content:center;
position:relative;border-radius:13px;background:#fff9;font-size:20px;font-weight:800}.today{outline:3px solid #63d9f4;background:#e8fbff;box-shadow:0 0 20px #50d7f5aa}
.ck{position:absolute;right:-10px;top:-18px;font-size:52px;color:#13a85c;font-weight:1000;opacity:0;transform:scale(.1) rotate(-25deg);text-shadow:0 0 5px white,0 0 15px #55ff99}
.ck.go{animation:pop .55s cubic-bezier(.1,1.7,.3,1) forwards}@keyframes pop{to{opacity:1;transform:scale(1) rotate(-7deg)}}
55%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}}
.hint{position:absolute;z-index:5;bottom:10px;left:50%;transform:translateX(-50%);color:white;opacity:.3;font-size:12px}</style></head>
<body><div id="s"><div id="c"><div class="logo">HEART ME</div><div id="m" class="month"></div>
<div class="w"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div id="d" class="d"></div></div>
<div class="hint">クリックでテスト</div></div><script>
const C=document.getElementById("c"),D=document.getElementById("d");
let busy=false;
function calendar(){let n=new Date(),y=n.getFullYear(),mo=n.getMonth(),td=n.getDate();m.textContent=y+" / "+String(mo+1).padStart(2,"0");D.innerHTML="";
for(let i=0;i<new Date(y,mo,1).getDay();i++)D.appendChild(document.createElement("div"));for(let q=1;q<=new Date(y,mo+1,0).getDate();q++){let e=document.createElement("div");e.className="day"+(q==td?" today":"");e.append(q);if(q==td){let k=document.createElement("span");k.className="ck";k.textContent="✓";e.append(k)}D.append(e)}}
function play(){if(busy)return;busy=true;calendar();C.className="";void C.offsetWidth;C.className="in";setTimeout(()=>document.querySelector(".ck")?.classList.add("go"),500);setTimeout(()=>{C.className="out"},4500);setTimeout(()=>{C.className="";busy=false},5100)}
calendar();document.addEventListener("click",play);window.playHeartMeCalendar=play;
const params=new URLSearchParams(location.search);
if(params.get("trigger")==="1")window.addEventListener("load",()=>setTimeout(play,120));</script></body></html>
